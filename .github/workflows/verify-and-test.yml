name: Verify and test

# Runs on every push and every pull request. Added 8 October 2026, after an
# external code review pointed out that pushing to main IS deploying — this
# repo has no staging environment, GitHub Pages serves straight from the
# repository root — and until now nothing stood between a commit and
# production except a human remembering to run the test suite by hand first.
#
# This does three things, in order, each one gating the next:
#   1. verify_structure.py  — the repo's own fast structural checks
#   2. build.py, then confirm the committed index.html/404.html are not
#      stale — these are GENERATED files (see DEPLOY.md); editing them by
#      hand instead of index_template.html/404_template.html is a mistake
#      this repo's own README already warns about, and nothing used to catch
#      it actually happening
#   3. every _test/*_test.py and _test/*_mutants.py file — the real
#      Playwright-driven suite. _test/*_shots.py files are deliberately
#      excluded: they photograph a screen for human review and assert
#      nothing, so there is no pass/fail signal to gate on.
#
# All three stages are self-maintaining: the loop in the last step picks up
# any test file added later with no workflow edit required.

on:
  push:
  pull_request:

jobs:
  verify-and-test:
    runs-on: ubuntu-latest
    env:
      # Every test file launches Chromium with
      # executable_path="/opt/pw-browsers/chromium" — the exact path Claude
      # Code's own sandbox pins its pre-installed browser to, which is where
      # these tests were written and run. A stock runner has no such path or
      # convenience symlink by default, so this job recreates it rather than
      # editing 40+ test files to stop assuming one environment. A handful of
      # files (favicon_test.py among them) call .launch() with no
      # executable_path at all; those fall back to Playwright's own
      # discovery, which reads this same PLAYWRIGHT_BROWSERS_PATH at runtime,
      # not only at install time — so it has to stay set for every step
      # after the install, not just during it.
      PLAYWRIGHT_BROWSERS_PATH: /opt/pw-browsers
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: pip install playwright Pillow

      - name: Install acorn
        # messages_test.py, parent_portal_test.py and progress_test.py each
        # check several portal scripts against CLAUDE.md's "Browser
        # JavaScript is ES5" rule (older phones in the community run
        # browsers that don't parse the rest — a blank screen, not a
        # warning). The real check is a parse with acorn --ecma5; without
        # acorn on PATH each test falls back to a naive regex line-scan,
        # which doesn't know a comment or a string from code — "`hidden`"
        # in a comment and "let us know" in a sentence both false-positive
        # as ES6. Installing the real parser is the fix; the nine files
        # those three tests were failing on were already correct ES5.
        run: npm install -g acorn

      - name: Install Chromium
        run: |
          sudo mkdir -p "$PLAYWRIGHT_BROWSERS_PATH"
          sudo chown -R "$(id -u):$(id -g)" "$PLAYWRIGHT_BROWSERS_PATH"
          playwright install --with-deps chromium chromium-headless-shell
          # Recreate the "chromium" convenience symlink the test suite's
          # executable_path hardcodes — Playwright's own install layout
          # names the real binary by version (chromium-####/chrome-linux/
          # chrome) and does not create this symlink itself.
          chrome_bin="$(find "$PLAYWRIGHT_BROWSERS_PATH" -maxdepth 3 -type f -name chrome | head -1)"
          if [ -z "$chrome_bin" ]; then
            echo "::error::playwright install did not produce a chrome binary under $PLAYWRIGHT_BROWSERS_PATH"
            exit 1
          fi
          ln -sf "$chrome_bin" "$PLAYWRIGHT_BROWSERS_PATH/chromium"
          echo "chromium -> $chrome_bin"

      - name: Verify structure
        run: python3 verify_structure.py

      - name: Build
        run: python3 build.py

      - name: Confirm index.html and 404.html are not stale
        run: |
          if ! git diff --exit-code -- index.html 404.html; then
            echo "::error::index.html and/or 404.html do not match what build.py" \
                 "generates from index_template.html/404_template.html. Someone" \
                 "edited the generated file directly, or forgot to rebuild and" \
                 "commit after editing the template. Run 'python3 build.py' and" \
                 "commit the result."
            exit 1
          fi

      - name: Run the test suite
        run: |
          set -e
          shopt -s nullglob
          for f in _test/*_test.py _test/*_mutants.py; do
            echo "::group::$f"
            python3 "$f"
            echo "::endgroup::"
          done
