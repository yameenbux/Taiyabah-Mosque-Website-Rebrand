        <div class="err" id="pm-error" role="alert" hidden></div>
        <p class="pt-loading" id="pm-loading">Loading your messages&hellip;</p>

        <!-- One conversation, opened: the words, then a reply box. -->
        <section class="pm-thread" id="pm-thread" aria-live="polite" hidden></section>

        <!-- Every conversation this family has had with the office. -->
        <section id="pm-list-wrap" hidden>
          <h2 class="pt-h" id="pm-list-h">Your conversations</h2>
          <ul class="pm-list" id="pm-list"></ul>
        </section>

        <!-- A new message, with the emergency words beside the box, because
             they are for the person about to type, not for a footer. -->
        <section class="pm-compose" id="pm-compose" hidden></section>

        <!-- After a message is sent. -->
        <section class="pt-done" id="pm-done" role="status" hidden></section>
